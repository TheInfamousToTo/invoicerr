name: Feature request
description: Suggest something Invoicerr should do.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        For a legal or tax rule of a country, use the "Country rule" form instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: The outcome you want
      description: What would be different once this exists?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other ways to solve it.
